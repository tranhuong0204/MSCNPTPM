name: Build and Deploy Analytics Service

on:
  push:
    branches:
      - learning
    paths:
      - 'analytics-service/**'
      - '.github/workflows/cd.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build analytics-service
        working-directory: ./analytics-service
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push analytics-service
        uses: docker/build-push-action@v6
        with:
          context: ./analytics-service
          push: true
          tags: |
            ghcr.io/tranhuong0204/mscnptpm/analytics-service:latest
            ghcr.io/tranhuong0204/mscnptpm/analytics-service:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy analytics-service
        run: |
          cd /opt/patient-management

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            pull analytics-service

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --force-recreate analytics-service

      - name: Check health
        run: |
          sleep 10
          docker inspect pm-analytics \
            --format='Health={{.State.Health.Status}}'