name: Build and Deploy Microservices

on:
  push:
    branches:
      - learning
      - feature/face-login
    paths:
      - 'api-gateway/**'
      - 'auth-service/**'
      - 'doctor-service/**'
      - 'patient-service/**'
      - 'clinical-service/**'
      - 'billing-service/**'
      - 'appointment-service/**'
      - 'pharmacy-service/**'
      - 'analytics-service/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/cd.yml'

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # 1. DETECT CHANGED SERVICES
  # ==========================================
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.services }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: filter
        shell: bash
        run: |
          services=()

          for service in \
            api-gateway \
            auth-service \
            doctor-service \
            patient-service \
            clinical-service \
            billing-service \
            appointment-service \
            pharmacy-service \
            analytics-service
          do
            if git diff --quiet HEAD^ HEAD -- "$service"; then
              echo "$service: no changes"
            else
              echo "$service: changed"
              services+=("$service")
            fi
          done

          if [ ${#services[@]} -eq 0 ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${services[@]}" | python3 -c '
          import sys
          import json

          services = [line.strip() for line in sys.stdin if line.strip()]
          print(json.dumps(services, separators=(",", ":")))
          ')

            echo "services=$json" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ==========================================
  build-and-push:
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/tranhuong0204/mscnptpm/${{ matrix.service }}:latest
            ghcr.io/tranhuong0204/mscnptpm/${{ matrix.service }}:${{ github.sha }}

  # ==========================================
  # 3. DEPLOY TO SERVER
  # ==========================================
  deploy:
    needs:
      - detect-changes
      - build-and-push

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: self-hosted

    steps:
      - name: Deploy services
        shell: bash
        env:
          SERVICES: ${{ needs.detect-changes.outputs.services }}

        run: |
          set -e

          cd /opt/patient-management

          echo "======================================"
          echo "Services to deploy:"
          echo "$SERVICES"
          echo "======================================"

          python3 <<'PY'
          import json
          import os
          import subprocess

          services = json.loads(os.environ["SERVICES"])

          for service in services:
              print(f"Deploying {service}...")

              subprocess.run(
                  [
                      "docker",
                      "compose",
                      "-f",
                      "docker-compose.yml",
                      "-f",
                      "docker-compose.prod.yml",
                      "pull",
                      service
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "docker",
                      "compose",
                      "-f",
                      "docker-compose.yml",
                      "-f",
                      "docker-compose.prod.yml",
                      "up",
                      "-d",
                      "--force-recreate",
                      service
                  ],
                  check=True
              )

              print(f"{service} deployed successfully.")

          print("======================================")
          print("All services deployed successfully.")
          print("======================================")
          PY