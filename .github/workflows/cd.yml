name: Build and Deploy Microservices

on:
  push:
    branches:
      - learning
    paths:
      - 'auth-service/**'
      - 'doctor-service/**'
      - 'patient-service/**'
      - 'clinical-service/**'
      - 'billing-service/**'
      - 'appointment-service/**'
      - 'pharmacy-service/**'
      - 'analytics-service/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/cd.yml'

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Detect changed services
        id: filter
        shell: bash
        run: |
          services=()
          for service in auth-service doctor-service patient-service clinical-service billing-service appointment-service pharmacy-service analytics-service
          do
            if git diff --quiet HEAD^ HEAD -- "$service"; then
              echo "$service: no changes"
            else
              echo "$service: changed"
              services+=("$service")
            fi
          done
          if [ ${#services[@]} -eq 0 ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s -c .)
            echo "services=$json" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/tranhuong0204/mscnptpm/${{ matrix.service }}:latest
            ghcr.io/tranhuong0204/mscnptpm/${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: self-hosted
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy services
        shell: bash
        env:
          SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |
          set -e
          cd /opt/patient-management
          echo "$SERVICES" | jq -r '.[]' | while read -r service; do
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull "$service"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate "$service"
          done
