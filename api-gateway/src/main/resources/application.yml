server:
  port: 4004

spring:
  profiles:
    default: docker
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: doctor-service-uploads-route
          uri: ${services.doctor.url}
          predicates:
            - Path=/api/doctors/uploads/**
          filters:
            - StripPrefix=1

        - id: patient-service-uploads-route
          uri: ${services.patient.url}
          predicates:
            - Path=/api/patients/uploads/**
          filters:
            - StripPrefix=1

        - id: pharmacy-service-uploads-route
          uri: ${services.pharmacy.url}
          predicates:
            - Path=/api/pharmacy/uploads/**
          filters:
            - StripPrefix=1

        - id: ai-chat-public-route
          uri: ${services.clinical.url}
          predicates:
            - Path=/api/ai-clinical/chat
          filters:
            - StripPrefix=1

        - id: patient-service-route
          uri: ${services.patient.url}
          predicates:
            - Path=/api/patients, /api/patients/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: auth-public-route
          uri: ${services.auth.url}
          predicates:
            - Path=/auth/login, /auth/signup, /auth/validate, /auth/refresh, /auth/reset

          filters:
            - StripPrefix=1

        - id: auth-service-route
          uri: ${services.auth.url}
          predicates:
            - Path=/auth, /auth/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: billing-service-route
          uri: ${services.billing.url}
          predicates:
            - Path=/api/billing, /api/billing/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: appointment-service-route
          uri: ${services.appointment.url}
          predicates:
            - Path=/api/appointment, /api/appointment/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: analytics-service-route
          uri: ${services.analytics.url}
          predicates:
            - Path=/api/analytics, /api/analytics/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: doctor-service-route
          uri: ${services.doctor.url}
          predicates:
            - Path=/api/doctors, /api/doctors/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: clinical-service-route
          uri: ${services.clinical.url}
          predicates:
            - Path=/api/medical-records, /api/medical-records/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: clinical-ai-service-route
          uri: ${services.clinical.url}
          predicates:
            - Path=/api/ai-clinical, /api/ai-clinical/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: pharmacy-service-route
          uri: ${services.pharmacy.url}
          predicates:
            - Path=/api/pharmacy, /api/pharmacy/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: api-docs-patient-route
          uri: ${services.patient.url}
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

        - id: api-docs-auth-route
          uri: ${services.auth.url}
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs

        - id: api-docs-billing-route
          uri: ${services.billing.url}
          predicates:
            - Path=/api-docs/billing
          filters:
            - RewritePath=/api-docs/billing,/v3/api-docs

        - id: api-docs-appointment-route
          uri: ${services.appointment.url}
          predicates:
            - Path=/api-docs/appointment
          filters:
            - RewritePath=/api-docs/appointment,/v3/api-docs

        - id: api-docs-analytics-route
          uri: ${services.analytics.url}
          predicates:
            - Path=/api-docs/analytics
          filters:
            - RewritePath=/api-docs/analytics,/v3/api-docs

        - id: api-docs-doctor-route
          uri: ${services.doctor.url}
          predicates:
            - Path=/api-docs/doctor
          filters:
            - RewritePath=/api-docs/doctor,/v3/api-docs

        - id: api-docs-clinical-route
          uri: ${services.clinical.url}
          predicates:
            - Path=/api-docs/clinical
          filters:
            - RewritePath=/api-docs/clinical,/v3/api-docs

        - id: api-docs-pharmacy-route
          uri: ${services.pharmacy.url}
          predicates:
            - Path=/api-docs/pharmacy
          filters:
            - RewritePath=/api-docs/pharmacy,/v3/api-docs

auth:
  service:
    url: ${services.auth.url}

services:
  auth:
    url: http://auth-service:4005
  patient:
    url: http://localhost:4000
  doctor:
    url: http://localhost:4003
  clinical:
    url: http://localhost:4007
  pharmacy:
    url: http://localhost:4008
  billing:
    url: http://localhost:4001
  appointment:
    url: http://localhost:4002
  analytics:
    url: http://localhost:4006

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Dich vu benh nhan
        url: /api-docs/patients
      - name: Dich vu xac thuc
        url: /api-docs/auth
      - name: Dich vu thanh toan
        url: /api-docs/billing
      - name: Dich vu hen lich
        url: /api-docs/appointment
      - name: Dich vu phan tich
        url: /api-docs/analytics
      - name: Dich vu bac si
        url: /api-docs/doctor
      - name: Dich vu ho so benh an
        url: /api-docs/clinical
      - name: Dich vu hieu thuoc
        url: /api-docs/pharmacy

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
