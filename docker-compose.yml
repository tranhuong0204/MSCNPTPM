services:

  postgres:
    image: postgres:latest
    container_name: postgres
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pm-network
    restart: unless-stopped

  eureka-server:
    build: ./eureka-server
    container_name: pm-eureka
    environment:
      JAVA_OPTS: "-Xms128m -Xmx350m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          memory: 400M
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pm-network
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: pm-gateway
    ports:
      - "4004:4004"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
# vì api-gateway cần biết các service khác để định tuyến nên cần khai báo các biến môi trường cho các service khác
      AUTH_SERVICE_URL: http://auth-service:4005
      DOCTOR_SERVICE_URL: http://doctor-service:4003
      PATIENT_SERVICE_URL: http://patient-service:4000
      CLINICAL_SERVICE_URL: http://clinical-service:4007
      BILLING_SERVICE_URL: http://billing-service:4001
      APPOINTMENT_SERVICE_URL: http://appointment-service:4002
      PHARMACY_SERVICE_URL: http://pharmacy-service:4008
      ANALYTICS_SERVICE_URL: http://analytics-service:4006
    deploy:
      resources:
        limits:
         memory: 300M
    depends_on:
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4004/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pm-network
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: pm-auth
    ports:
      - "4005:4005"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AUTH_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-MzJieXRlc2VjcmV0a2V5Zm9yYXV0aG1lc2VydmljZXM=}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4005/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pm-network
    restart: unless-stopped

  patient-service:
    build: ./patient-service
    container_name: pm-patient
    ports:
      - "4000:4000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PATIENT_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - patient_uploads:/app/uploads
    networks:
      - pm-network
    restart: unless-stopped

  doctor-service:
    build: ./doctor-service
    container_name: pm-doctor
    ports:
      - "4003:4003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DOCTOR_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4003/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - doctor_uploads:/app/uploads
    networks:
      - pm-network
    restart: unless-stopped

  clinical-service:
    build: ./clinical-service
    container_name: pm-clinical
    ports:
      - "4007:4007"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${CLINICAL_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4007/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pm-network
    restart: unless-stopped

  billing-service:
    build: ./billing-service
    container_name: pm-billing
    ports:
      - "4001:4001"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BILLING_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4001/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pm-network
    restart: unless-stopped

  appointment-service:
    build: ./appointment-service
    container_name: pm-appointment
    ports:
      - "4002:4002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${APPOINTMENT_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4002/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pm-network
    restart: unless-stopped

  pharmacy-service:
    build: ./pharmacy-service
    container_name: pm-pharmacy
    ports:
      - "4008:4008"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PHARMACY_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4008/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - pharmacy_uploads:/app/uploads
    networks:
      - pm-network
    restart: unless-stopped

  zookeeper:
    image: zookeeper:latest
    container_name: pm-zookeeper
    networks:
      - pm-network
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka:latest
    container_name: pm-kafka
    ports:
      - "9092:9092"
      - "9094:9094"  # external client

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
    depends_on:
      - zookeeper
    networks:
      - pm-network
    restart: unless-stopped

  analytics-service:
    build: ./analytics-service
    container_name: pm-analytics
    ports:
      - "4006:4006"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ANALYTICS_DB}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -Xss256k"
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4006/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pm-network
    restart: unless-stopped

networks:
  pm-network:
    driver: bridge

volumes:
  postgres_data:
  patient_uploads:
  doctor_uploads:
  pharmacy_uploads:
