apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: patient-management
spec:
  replicas: 1

  selector:
    matchLabels:
      app: eureka-server

  template:
    metadata:
      labels:
        app: eureka-server

    spec:
      containers:
        - name: eureka-server
          image: ghcr.io/tranhuong0204/mscnptpm/eureka-server:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8761

          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3